[package]
name = "perch"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Perch - a lightweight dynamic notch / island for Windows and Linux"
default-run = "perch"

[lib]
name = "perch_app"
path = "src/lib.rs"

[[bin]]
name = "perch"
path = "src/main.rs"

[dependencies]
perch-core = { path = "../core" }
perch-ui = { path = "../ui" }
anyhow.workspace = true
log.workspace = true
env_logger.workspace = true
notify.workspace = true
winit.workspace = true
tiny-skia.workspace = true
image = { workspace = true }
serde.workspace = true
serde_json.workspace = true
directories.workspace = true
ureq = { workspace = true, optional = true }
rusqlite = { workspace = true, optional = true }
rodio = { workspace = true, optional = true }

[features]
default = ["media", "lyrics", "productivity", "clipboard", "white-noise", "screen-time"]
# Optional features are compile-time gated as well as config-gated, so a build
# without them does not contain their code at all.
media = []
lyrics = ["ureq"]
productivity = []
screen-time = ["rusqlite"]
clipboard = []
white-noise = ["rodio"]
speech = []
screenshot = []
camera = []
all-features = [
    "media",
    "lyrics",
    "productivity",
    "screen-time",
    "clipboard",
    "white-noise",
]

[target.'cfg(windows)'.dependencies]
tray-icon = { workspace = true }
perch-platform-windows = { path = "../platform-windows" }

[target.'cfg(target_os = "linux")'.dependencies]
perch-platform-linux = { path = "../platform-linux" }

[dev-dependencies]
tempfile.workspace = true
