[package]
name = "perch"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Perch - a lightweight dynamic notch / island for Windows and Linux"
default-run = "perch"

[lib]
name = "perch_app"
path = "src/lib.rs"

[[bin]]
name = "perch"
path = "src/main.rs"

[dependencies]
perch-core = { path = "../core" }
perch-ui = { path = "../ui" }
log.workspace = true
env_logger.workspace = true
notify.workspace = true
winit.workspace = true
tiny-skia.workspace = true
image = { workspace = true }
serde.workspace = true
serde_json.workspace = true
directories.workspace = true
ureq = { workspace = true, optional = true }
rusqlite = { workspace = true, optional = true }
rodio = { workspace = true, optional = true }
whisper-rs = { version = "0.16", optional = true }
cpal = { version = "0.15", optional = true }
sha2 = { version = "0.10", optional = true }
nokhwa = { version = "0.10", optional = true, features = ["input-native"] }

[features]
default = [
    "media",
    "lyrics",
    "productivity",
    "clipboard",
    "white-noise",
    "screen-time",
    "screenshot",
    "camera",
]
# Optional features are compile-time gated as well as config-gated, so a build
# without them does not contain their code at all.
media = []
lyrics = ["ureq"]
productivity = []
screen-time = ["rusqlite"]
clipboard = []
white-noise = ["rodio"]
speech = ["whisper-rs", "cpal", "sha2", "ureq"]
screenshot = []
camera = ["nokhwa"]
# Everything, including the separately shipped dictation build.
all-features = [
    "media",
    "lyrics",
    "productivity",
    "screen-time",
    "clipboard",
    "white-noise",
    "screenshot",
    "camera",
    "speech",
]

[target.'cfg(windows)'.dependencies]
tray-icon = { workspace = true }
perch-platform-windows = { path = "../platform-windows" }

[target.'cfg(target_os = "linux")'.dependencies]
perch-platform-linux = { path = "../platform-linux" }

[dev-dependencies]
tempfile.workspace = true
hound = "3.5"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[package.metadata.deb]
name = "perch"
maintainer = "Perch contributors <perch@users.noreply.invalid>"
copyright = "2026, Perch contributors"
license-file = ["../../LICENSE-MIT", "0"]
extended-description = """\
A small dynamic notch at the top of the screen that expands on hover: \
now playing (MPRIS) with synced lyrics, to-dos, Pomodoro, clipboard history, \
a file shelf, reminders, per-app volume, white noise, screen time, a \
screenshot tool with OCR and a camera mirror. Everything runs locally."""
section = "utils"
priority = "optional"
depends = "$auto"
recommends = "tesseract-ocr"
suggests = "playerctl"
assets = [
    ["target/release/perch", "usr/bin/", "755"],
    ["../../packaging/linux/perch.desktop", "usr/share/applications/", "644"],
    ["../../assets/perch.png", "usr/share/icons/hicolor/256x256/apps/perch.png", "644"],
    ["../../assets/perch-128.png", "usr/share/icons/hicolor/128x128/apps/perch.png", "644"],
    ["../../README.md", "usr/share/doc/perch/README.md", "644"],
]
