[package]
name = "perch-platform-linux"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Linux (X11 primary, Wayland best-effort) backends for Perch"

[target.'cfg(target_os = "linux")'.dependencies]
log.workspace = true
perch-core = { path = "../core" }
zbus = { workspace = true }
serde.workspace = true
arboard.workspace = true
libpulse-binding = { version = "2.30", default-features = false }
image = { workspace = true }
ksni = { workspace = true }
x11rb = { workspace = true, features = [
    "allow-unsafe-code",
    "randr",
    "xfixes",
    "xinput",
    "screensaver",
    "xtest",
    "shape",
    "xkb",
] }

[target.'cfg(target_os = "linux")'.dev-dependencies]
perch-core = { path = "../core" }
